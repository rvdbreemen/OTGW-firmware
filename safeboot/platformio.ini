; OTGW safeboot updater (ADR-191, TASK-1223.3/.4).
; A separate PlatformIO project: build.py runs `pio run -d safeboot`. It lives in
; the app/factory partition of the shared 4MB table and must stay below 960K
; (build.py checks the size against the "safeboot" partition).
[platformio]
default_envs = safeboot

[env:safeboot]
; Same pinned platform as the main firmware (platformio.ini [env:esp32]).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = ../partitions_otgw_esp32.csv
board_build.app_partition_name = safeboot
build_type = release
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  Update
  WebServer
  Preferences
build_flags =
  -Os
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUPDATE_NOCRYPT
  -DHTTPCLIENT_NOSECURE
