name: Beta prerelease publish

# Fires when a prerelease tag is pushed (any tag with a dash after the
# version, e.g. v1.6.0-beta.4, v1.6.0-alpha.2, v1.6.0-rc.1). Stable tags
# (v1.5.0, no dash) are NOT matched; those are handled entirely by the
# /release skill, which generates its assets with
# scripts/make_release_assets.py and attaches them to the draft.
#
# What this workflow does (self-contained, single job):
#   1. Build firmware + filesystem binaries with build.py.
#   2. Detect the latest PUBLIC stable release for the diff link
#      (not the previous beta — testers want to know what changed since
#      the last shipping version).
#   3. Generate SHA256SUMS and the OTGW-firmware-<version>-flash-bundle.zip.
#   4. Compose a release body that links the in-repo README.md, CHANGELOG.md
#      and RELEASE_NOTES_*.md (if present at the tagged commit) so testers
#      can read what is in the build straight from the GitHub release page.
#   5. Create the release as DRAFT with all assets (firmware, filesystem,
#      SHA256SUMS, flash_otgw.sh, flash_otgw.bat, flash-bundle.zip) attached
#      in one atomic gh release create call.
#   6. Flip draft -> published. The repo enforces immutable releases, so
#      the release locks at this step; doing the asset attach earlier
#      (against an already-published release) fails with HTTP 422
#      "Cannot upload assets to an immutable release".
#
# Self-contained because GITHUB_TOKEN-created release events do not trigger
# downstream workflows. An earlier version relied on a release-assets.yml
# chaining in on release:published, which silently did not fire for beta
# tags. SHA256SUMS / flash scripts / bundle are now generated here.
#
# That workflow has since been deleted outright (TASK-1074): on a repository
# with immutable releases NO asset can be attached after publish, so a
# release:published trigger is always too late, for stable tags as well.
#
# Manual re-run: workflow_dispatch with a tag input lets the maintainer
# re-publish a stuck draft without pushing a new tag.
#
# Security model: this workflow publishes a prerelease the moment a tag
# matching `v*-*.*` is pushed OR a workflow_dispatch run completes — there
# is no human-approval gate between draft and publish. The "create as
# draft then flip to live" pattern only works around GitHub's
# immutable-release upload restriction, NOT as a review checkpoint.
# Anyone with `contents: write` on the repo can therefore trigger a
# published prerelease. The `ref` input on workflow_dispatch is
# hard-restricted (below) to dev / main / explicit commit SHAs to prevent
# publishing arbitrary PR-head refs.
# See TASK-656 for the design discussion.

on:
  push:
    tags:
      - 'v*-*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag to (re)publish (e.g. v1.6.0-beta.4). Created at `ref` if missing.'
        required: true
        type: string
      ref:
        description: 'Branch or commit to tag if `tag` does not yet exist (must be `dev`, `otgw-1.x.x`, or a 7-40 char hex SHA — main and PR refs are rejected; stable releases use the /release skill). Required when the tag does not exist yet; ignored when it does.'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    name: Build firmware, publish prerelease, attach assets
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create release and upload assets

    steps:
      - name: Create tag if missing (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          REF="${{ inputs.ref }}"
          # TASK-656: hard-restrict the ref to a known development line or a
          # 7-40 char hex SHA. This workflow is the BETA-prerelease pipeline —
          # stable releases (main) go through the /release skill and a different
          # workflow chain, so main is intentionally NOT allowed here. gh api
          # would otherwise resolve arbitrary refs (refs/pull/<N>/head,
          # feature/...) and a maintainer dispatch could publish a prerelease
          # from un-reviewed PR code. The tag-already-exists path is exempt
          # because the tag itself is the source of truth at that point.
          #
          # TASK-1117: two development lines feed this workflow, not one.
          # `dev` carries 2.0.0 (ESP32) and `otgw-1.x.x` carries the 1.x
          # maintenance line, and every beta this workflow has actually
          # published came from the latter. There is deliberately NO default:
          # a default of `dev` meant that re-publishing a stuck 1.x beta with a
          # missing tag would tag dev HEAD and ship 2.0.0 ESP32 code under a
          # 1.7.x version number. Making the caller name the line fails closed.
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            if [ -z "${REF}" ]; then
              echo "ERROR: tag '${TAG}' does not exist yet, so 'ref' is required."
              echo "       Name the development line the tag belongs to: 'dev' (2.0.0/ESP32)"
              echo "       or 'otgw-1.x.x' (1.x maintenance), or an explicit commit SHA."
              echo "       There is no default on purpose: guessing the wrong line publishes"
              echo "       one line's code under the other line's version number."
              exit 1
            fi
            if ! echo "${REF}" | grep -qE '^(dev|otgw-1\.x\.x|[0-9a-f]{7,40})$'; then
              echo "ERROR: ref '${REF}' is not allowed. Must be 'dev', 'otgw-1.x.x',"
              echo "       or a 7-40 char hex commit SHA."
              echo "       Beta-prerelease publishes from development lines only; stable"
              echo "       releases use the /release skill."
              echo "       This guard also prevents publishing from arbitrary PR refs (refs/pull/<N>/head)."
              echo "       See TASK-656, TASK-1117."
              exit 1
            fi
            SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq '.sha')
            [ -n "${SHA}" ] || { echo "ERROR: could not resolve ref '${REF}' to a commit SHA"; exit 1; }
            echo "Creating tag ${TAG} at ${REF} (${SHA})"
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${SHA}"
          else
            echo "Tag ${TAG} already exists on origin, reusing it."
          fi

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Version without the leading 'v', used in bundle filename
          VERSION="${TAG#v}"
          # Base version with prerelease suffix stripped (e.g. 1.6.0-beta.4 -> 1.6.0)
          BASE_VERSION=$(echo "${VERSION}" | sed -E 's/-(beta|rc|alpha)(\.[0-9]+)?$//')
          echo "tag=${TAG}"                   >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}"           >> "${GITHUB_OUTPUT}"
          echo "base_version=${BASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag: ${TAG} (version=${VERSION}, base=${BASE_VERSION})"

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0   # needed for previous-release detection

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build firmware and filesystem
        run: |
          python build.py
          echo "--- build artefacts ---"
          ls -la build/ || true

      - name: Locate built binaries
        id: binaries
        run: |
          FW=$(ls build/*.ino.bin 2>/dev/null | head -1)
          FS=$(ls build/*.littlefs.bin 2>/dev/null | head -1)
          [ -n "${FW}" ] || { echo "ERROR: firmware binary (*.ino.bin) not found in build/"; exit 1; }
          [ -n "${FS}" ] || { echo "ERROR: filesystem binary (*.littlefs.bin) not found in build/"; exit 1; }
          echo "firmware=${FW}"   >> "${GITHUB_OUTPUT}"
          echo "filesystem=${FS}" >> "${GITHUB_OUTPUT}"
          echo "Firmware:   ${FW}"
          echo "Filesystem: ${FS}"

      - name: Detect latest PUBLIC stable release (for diff link)
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "Latest" on GitHub is by construction a non-prerelease release.
          # gh release view (no args) returns whichever release carries that flag.
          # Fallback to the most recent tag without a dash if no release is flagged.
          if PREV=$(gh release view --json tagName --jq '.tagName' 2>/dev/null) && [ -n "${PREV}" ]; then
            :
          else
            PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                     | grep -v -- '-' | head -1 || true)
          fi
          echo "prev_tag=${PREV}" >> "${GITHUB_OUTPUT}"
          echo "Latest public release: ${PREV:-<none>}"

      - name: Generate SHA256SUMS for the binaries
        run: |
          FW="${{ steps.binaries.outputs.firmware }}"
          FS="${{ steps.binaries.outputs.filesystem }}"
          mkdir -p staging
          cp "${FW}" "${FS}" staging/
          ( cd staging && sha256sum *.ino.bin *.littlefs.bin ) > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # A beta asks its testers to report findings, so the tools for producing a
      # usable report ship with it. This matters more here than on a stable
      # release: betas are where the bug reports actually come from.
      - name: Write RELEASE_ASSETS.md
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          cat > RELEASE_ASSETS.md <<EOF
          # What is in this beta (${TAG})

          This is a **beta**. It is for testing, and reporting back is the point.

          ## Flashing it

          Download **OTGW-firmware-${VERSION}-flash-bundle.zip**: it holds both
          binaries, both flash scripts, the guide and the checksums, so it is the
          only file most people need.

          Flash **both** the firmware and the filesystem. Betas frequently change
          the web interface, and flashing only the firmware leaves the old
          interface in place against new firmware. Settings are preserved.

          ## The individual files

          | Asset | What it is |
          |---|---|
          | \`OTGW-firmware-${VERSION}+<githash>.ino.bin\` | The firmware. |
          | \`OTGW-firmware.${VERSION}+<githash>.littlefs.bin\` | The filesystem: web interface and assets. Flash alongside the firmware. |
          | \`OTGW-firmware-${VERSION}-flash-bundle.zip\` | Everything in one download. Start here. |
          | \`flash_otgw.bat\` / \`flash_otgw.sh\` | Flash helpers for Windows and Linux/macOS. |
          | \`SHA256SUMS\` | Checksums for the two binaries; the flash helpers verify against this. |
          | \`capture-mqtt-debug.bat\` | Diagnostic capture, Windows. Run this when something misbehaves. |
          | \`capture-usb-serial.bat\` | Diagnostic capture over USB, for a device that will not come up on WiFi. |
          | \`RELEASE_ASSETS.md\` | This file. |

          ## Reporting something

          A log is the difference between a guess and a diagnosis. Nearly every
          bug fixed in this line was found from a capture, not from a
          description.

          1. Run \`capture-mqtt-debug.bat\`. It asks for your gateway address and
             MQTT broker details (\`capture-settings.example.json\` inside the
             bundle shows the format if you would rather pre-fill them).
          2. Reproduce the problem while it runs, then press Q to stop.
          3. Attach the \`transcript-*.txt\` it produced. One file, containing the
             telnet log, the MQTT stream, the browser console and the crash log.

          Post it in **#beta-testing** on Discord, or open an issue at
          https://github.com/rvdbreemen/OTGW-firmware/issues

          A capture contains your WiFi SSID, MQTT username and broker address. It
          does not contain your MQTT password. Have a look before posting publicly.
          EOF
          echo "--- RELEASE_ASSETS.md ---"
          cat RELEASE_ASSETS.md

      - name: Build flash bundle zip
        id: bundle
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          BUNDLE_NAME="OTGW-firmware-${VERSION}-flash-bundle"
          BUNDLE_DIR="${BUNDLE_NAME}"
          mkdir -p "${BUNDLE_DIR}"
          cp flash_otgw.sh             "${BUNDLE_DIR}/"
          cp flash_otgw.bat            "${BUNDLE_DIR}/"
          cp README.md                 "${BUNDLE_DIR}/"
          cp RELEASE_ASSETS.md         "${BUNDLE_DIR}/"
          if [ -f docs/guides/FLASH_GUIDE.md ]; then
            cp docs/guides/FLASH_GUIDE.md "${BUNDLE_DIR}/"
          fi
          # Capture tooling, so a tester can produce a transcript without hunting
          # through the repository for it.
          mkdir -p "${BUNDLE_DIR}/capture"
          cp scripts/capture-mqtt-debug.bat        "${BUNDLE_DIR}/capture/"
          cp scripts/capture-usb-serial.bat        "${BUNDLE_DIR}/capture/"
          cp scripts/capture-settings.example.json "${BUNDLE_DIR}/capture/"
          cp staging/*.ino.bin         "${BUNDLE_DIR}/"
          cp staging/*.littlefs.bin    "${BUNDLE_DIR}/"
          cp SHA256SUMS                "${BUNDLE_DIR}/"
          chmod +x "${BUNDLE_DIR}/flash_otgw.sh"
          zip -r "${BUNDLE_NAME}.zip" "${BUNDLE_DIR}/"
          echo "bundle=${BUNDLE_NAME}.zip" >> "${GITHUB_OUTPUT}"
          echo "Bundle: ${BUNDLE_NAME}.zip"

      - name: Compose release body
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          BASE_VERSION="${{ steps.tag.outputs.base_version }}"
          PREV="${{ steps.prev.outputs.prev_tag }}"
          REPO="${{ github.repository }}"

          # Locate the in-repo release notes file for this build (best-effort).
          # Prefer the exact version, then the line's beta file, then archived copies.
          # NOTES_PATH is the on-disk path (used for inlining the digest below).
          # NOTES_LINK is the GitHub blob URL at the tag (used as the read-full link).
          NOTES_PATH=""
          NOTES_LINK=""
          for candidate in \
            "RELEASE_NOTES_${VERSION}.md" \
            "RELEASE_NOTES_${BASE_VERSION}-beta.md" \
            "docs/releases/RELEASE_NOTES_${VERSION}.md" \
            "docs/releases/RELEASE_NOTES_${BASE_VERSION}-beta.md"
          do
            if [ -f "${candidate}" ]; then
              NOTES_PATH="${candidate}"
              NOTES_LINK="https://github.com/${REPO}/blob/${TAG}/${candidate}"
              echo "Release notes file at tagged commit: ${candidate}"
              break
            fi
          done

          # Extract the digest (content above the '<!-- digest:end -->' sentinel)
          # for inline preview in the release body. If the sentinel is missing,
          # inline the whole file. If no notes file was found, the inline
          # section is omitted entirely (graceful fallback to the pre-digest
          # release body shape).
          DIGEST_FILE=""
          DIGEST_SOURCE=""
          if [ -n "${NOTES_PATH}" ]; then
            DIGEST_FILE="release_body_digest.md"
            DIGEST_SOURCE="${NOTES_PATH}"
            if grep -q '<!-- digest:end -->' "${NOTES_PATH}"; then
              awk '/<!-- digest:end -->/{exit} {print}' "${NOTES_PATH}" > "${DIGEST_FILE}"
              echo "Digest extracted from ${NOTES_PATH} (above '<!-- digest:end -->' marker)."
            else
              cp "${NOTES_PATH}" "${DIGEST_FILE}"
              echo "WARN: ${NOTES_PATH} has no '<!-- digest:end -->' sentinel; inlining the entire file as the release-page digest."
            fi
            # Strip the leading H1 if present; the release body provides its own H2 heading.
            sed -i '1{/^# /d}' "${DIGEST_FILE}"
          fi

          # TASK-1117: a RELEASE_NOTES_<version>.md file is written at STABLE
          # release time, so during a beta cycle the loop above finds nothing and
          # the release page used to lead with a glossary of what a .ino.bin is.
          # CHANGELOG.md's "## [Unreleased]" section is the one thing that IS
          # current on every beta: the /beta-prerelease skill compares the TASK
          # ids in the commits against the ids under that heading and refuses to
          # ship until they match. So it is the best available answer to the only
          # question a tester opens this page for.
          if [ -z "${DIGEST_FILE}" ] && [ -f CHANGELOG.md ]; then
            CANDIDATE="release_body_digest.md"
            awk '
              /^## \[Unreleased\]/ { inside = 1; next }
              inside && /^## \[/    { exit }
              inside                { print }
            ' CHANGELOG.md > "${CANDIDATE}"
            # A heading with nothing under it is worse than no section at all.
            if grep -qE '[^[:space:]]' "${CANDIDATE}"; then
              DIGEST_FILE="${CANDIDATE}"
              DIGEST_SOURCE="CHANGELOG.md (Unreleased)"
              echo "Digest extracted from the CHANGELOG [Unreleased] section."
            else
              rm -f "${CANDIDATE}"
              echo "WARN: CHANGELOG.md has no non-empty [Unreleased] section at this tag;"
              echo "      the release body will carry no change summary. Fill it in before the next beta."
            fi
          fi

          # TASK-1117: derive the branch instead of asserting one. This body used
          # to state "Published automatically from a tag push on the `dev` branch"
          # on every beta, which was false on every beta this workflow has ever
          # published: they are all tagged on otgw-1.x.x. Name a branch only when
          # exactly one contains the tag, and say nothing when it is ambiguous.
          # A missing sentence is a smaller defect than a confident wrong one.
          BRANCHES=$(git branch -r --contains "${TAG}" --format='%(refname:short)' 2>/dev/null \
                       | sed 's|^origin/||' | grep -vE '^(HEAD|$)' | sort -u || true)
          BRANCH_COUNT=$(printf '%s\n' "${BRANCHES}" | grep -cE '[^[:space:]]' || true)
          if [ "${BRANCH_COUNT}" = "1" ]; then
            PROVENANCE="Built and published automatically from the \`${BRANCHES}\` branch."
          else
            PROVENANCE="Built and published automatically from the tagged commit."
            echo "Tag ${TAG} is on ${BRANCH_COUNT} branches; omitting the branch name from the body."
          fi

          {
            echo "Beta prerelease **${TAG}**."
            echo ""
            echo "${PROVENANCE}"
            echo ""
            if [ -n "${DIGEST_FILE}" ] && [ -s "${DIGEST_FILE}" ]; then
              echo "## What is in this build"
              echo ""
              cat "${DIGEST_FILE}"
              echo ""
            else
              echo "## What is in this build"
              echo ""
              echo "No change summary was available at this tag. See the diff link below."
              echo ""
            fi
            if [ -n "${PREV}" ]; then
              echo "Every change since the last stable release: https://github.com/${REPO}/compare/${PREV}...${TAG}"
            else
              echo "No prior public release detected; diff link omitted."
            fi
            echo ""
            echo "## Flashing"
            echo ""
            echo "Flash **both** the firmware and the filesystem. A new firmware with an old"
            echo "filesystem keeps serving the previous web interface, which is the most common"
            echo "cause of \"the fix is not there\" after an update. Settings are preserved."
            echo ""
            echo "\`OTGW-firmware-${VERSION}-flash-bundle.zip\` holds both images, both flash"
            echo "scripts, the guide and the checksums, so it is the only asset most people need."
            echo ""
            echo "## Reporting"
            echo ""
            echo "This is a beta, and reporting back is the point. Findings go to Discord"
            echo "\`#beta-testing\`, good and bad. A capture says more than a description:"
            echo "\`capture-mqtt-debug.bat\` and \`capture-usb-serial.bat\` are attached for that."
            echo ""
            echo "<details><summary>What each asset is</summary>"
            echo ""
            echo "- \`*.ino.bin\` — firmware image (flash via Web UI, OTA, or \`flash_otgw.sh\`/\`.bat\`)."
            echo "- \`*.littlefs.bin\` — filesystem image (Web UI assets, settings template)."
            echo "- \`SHA256SUMS\` — integrity manifest used by the flash helpers."
            echo "- \`flash_otgw.sh\` / \`flash_otgw.bat\` — Linux/macOS and Windows flash helpers."
            echo "- \`capture-mqtt-debug.bat\` / \`capture-usb-serial.bat\` — capture helpers for bug reports."
            echo "- \`OTGW-firmware-${VERSION}-flash-bundle.zip\` — self-contained zip with binaries, scripts, README and SHA256SUMS."
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "[\`CHANGELOG.md\`](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)"
            if [ -n "${NOTES_LINK}" ]; then
              echo " | [full release notes](${NOTES_LINK})"
            fi
            echo " | [\`README.md\`](https://github.com/${REPO}/blob/${TAG}/README.md)"
          } > release_body.md
          echo "--- release body (digest source: ${DIGEST_SOURCE:-none}) ---"
          cat release_body.md

      - name: Publish prerelease (draft-first, attach assets atomically)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          FW="${{ steps.binaries.outputs.firmware }}"
          FS="${{ steps.binaries.outputs.filesystem }}"
          BUNDLE="${{ steps.bundle.outputs.bundle }}"

          # If a draft for this tag already exists from a prior aborted run,
          # top up assets and body. If it exists AND is already published,
          # bail out: the repo's immutable-releases policy makes this tag
          # permanently locked, so the only recovery is to bump the prerelease.
          if gh release view "${TAG}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "Existing draft for ${TAG} detected; topping up assets and body."
            gh release upload "${TAG}" \
              "${FW}" "${FS}" \
              SHA256SUMS \
              RELEASE_ASSETS.md \
              flash_otgw.sh \
              flash_otgw.bat \
              scripts/capture-mqtt-debug.bat \
              scripts/capture-usb-serial.bat \
              "${BUNDLE}" \
              --clobber
            gh release edit "${TAG}" --prerelease --title "${TAG}" --notes-file release_body.md
          elif gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: ${TAG} already exists as a published release."
            echo "This repo enforces immutable releases; the tag is reserved permanently."
            echo "Recovery: bump the prerelease (e.g. beta.N -> beta.N+1) on the development"
            echo "line this tag came from (dev for 2.0.0, otgw-1.x.x for 1.x) and push the new tag."
            exit 1
          else
            echo "Creating draft prerelease ${TAG} with all assets in one atomic call."
            gh release create "${TAG}" \
              --draft \
              --prerelease \
              --title "${TAG}" \
              --notes-file release_body.md \
              "${FW}" "${FS}" \
              SHA256SUMS \
              RELEASE_ASSETS.md \
              flash_otgw.sh \
              flash_otgw.bat \
              scripts/capture-mqtt-debug.bat \
              scripts/capture-usb-serial.bat \
              "${BUNDLE}"
          fi

          # Publish: draft -> live. Immutability locks at this step, after
          # every asset is already attached.
          echo "Publishing ${TAG} (draft -> live)."
          gh release edit "${TAG}" --draft=false

          echo "--- final state of ${TAG} ---"
          gh release view "${TAG}" \
            --json tagName,isPrerelease,isDraft,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, draft: .isDraft, assets: [.assets[].name]}'
