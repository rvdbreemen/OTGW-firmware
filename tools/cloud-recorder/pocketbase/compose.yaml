# Synology Container Manager project: PocketBase + Cloudflare Tunnel (TASK-1938).
# Put TUNNEL_TOKEN and RETENTION_DAYS in a .env file next to this file (never commit it).
services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: "0.40.6"
        PB_ARCH: "amd64"          # arm64 on an ARMv8 Synology
    restart: unless-stopped
    environment:
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks:ro
      - ./pb_migrations:/pb/pb_migrations:ro
    # Admin UI on the LAN only: http://<synology-ip>:8090/_/
    # The tunnel reaches PocketBase over the project network, not over this port.
    ports:
      - "8090:8090"

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - pocketbase
