; TASK-1654: OpenTherm boiler simulator for a second OTGW32. A separate PlatformIO project: it is not
; part of the firmware build (build.py / build.bat never see it) and it shares no build directory with
; it. Build and flash only with the maintainer's OK, one build at a time on this machine (see README).
[platformio]
src_dir = src
data_dir = data
default_envs = ot-boiler-sim

[env:ot-boiler-sim]
; Same pinned platform as the firmware (platformio.ini [env:esp32]).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
framework = arduino
; The vendored OpenTherm library (submodule src/libraries/OpenTherm), used in slave mode.
lib_deps =
  symlink://../../../src/libraries/OpenTherm
; USB log over the S3's native USB port.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
